defaults:
  interval_days: 10
  lookback_days: 180
  target_count: 10
  request_timeout_seconds: 30
  max_retries: 3
  max_pages_per_source: 5
  polite_delay_seconds: 1.0
  arxiv_delay_seconds: 3.0
  proceedings_delay_seconds: 5.0
  max_candidates: 5000

sources:
  openalex:
    enabled: true
    per_page: 200
  crossref:
    enabled: true
    rows: 200
  dblp:
    enabled: true
    per_page: 1000
    max_conference_queries: 25
  arxiv:
    enabled: true
    max_results: 500
  proceedings: []

